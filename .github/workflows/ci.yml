name: CI

on:
  push:
  pull_request:

jobs:
  web-build:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install web dependencies
        run: |
          cd web
          npm install

      - name: Build web app
        run: |
          cd web
          npm run build
